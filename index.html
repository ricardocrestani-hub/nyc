main .wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
.dayhead{display:flex;gap:12px;align-items:flex-start}

.dayhead h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;text-wrap:balance}

.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 .85rem var(--body);padding:9px 14px;border-radius:999px;border:1.5px solid var(--fg);color:var(--fg);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;border:3px solid var(--fg);display:inline-block}
.sw.o{border-style:dashed;border-color:var(--opt)}
ol.line{list-style:none;margin:0;padding:0;position:relative}
ol.line::before{content:"";position:absolute;left:21px;top:14px;bottom:14px;width:6px;border-radius:3px;background:var(--line)}
.stop{display:grid;grid-template-columns:48px 1fr;column-gap:10px;padding-block:4px}
.move{grid-column:2;font:500 .74rem var(--mono);color:var(--muted);padding:2px 0 6px 2px;display:flex;gap:6px;align-items:center}
.move b{font-weight:600;color:var(--fg);font-family:var(--body);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
.move.walk b{color:var(--l3)}
.dot{grid-column:1;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--line);margin:6px 0 0 14px;position:relative;z-index:1;cursor:pointer;padding:0}
.stop.done .dot{background:var(--line)}
.dot:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.card{grid-column:2;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.time{font:500 .78rem var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.name{font:700 1rem var(--display);margin:0}
.note{font-size:.86rem;color:var(--muted);margin:0}
.note strong{color:var(--fg);font-weight:600}
.tag{font:600 .66rem var(--body);text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.tag.opt{border-style:dashed;border-color:var(--opt);color:var(--opt)}
.maps{align-self:flex-start;font:600 .8rem var(--body);color:var(--fg);text-decoration:underline;text-underline-offset:3px;margin-top:2px}
.stop.opt .card{background:var(--optbg);border-style:dashed}

.stop.opt .dot{border-style:dashed;border-color:var(--opt)}
.stop.opt .maps{color:var(--opt)}
.stop.done .name,.stop.done .note{color:var(--done);text-decoration:line-through}
section.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
section.panel h3{font:800 1rem var(--display);margin:0 0 8px}
section.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.hint{font-size:.78rem;color:var(--muted);margin:0}

function renderShop(){return SHOP.map((s,si)=>`<section class="panel"><h3>${esc(s.store)}</h3><p class="hint" style="margin-bottom:8px">${esc(s.when)}</p><ol class="line" style="--line:var(--rule)">`+s.items.map((it,j)=>{const id="shop-"+si+"-"+j,on=store[id];return `<li class="stop ${on?"done":""}"><button class="dot" data-id="${id}" aria-pressed="${!!on}" aria-label="Marcar ${esc(it[0])} como comprado"></button><div class="card"><div class="top"><p class="name" style="font-size:.92rem">${esc(it[0])}</p>${it[2]?`<span class="time">${esc(it[2])}</span>`:""}</div><p class="note">${esc(it[1])}</p>${it[3]?`<a class="maps" href="${it[3]}" target="_blank" rel="noopener">Ver no site</a>`:""}</div></li>`}).join("")+`</ol></section>`).join("")+`<section class="panel"><h3>Estimativa</h3><ul><li>Uniqlo: ≈ $430–470, contando meias e cuecas</li><li>Muji: ≈ $220</li><li>3sixteen: $310 + imposto ≈ $340</li><li>Perfumes: ≈ $390–660, conforme leve 1 ou 2 CDG, com imposto</li><li><strong>Total: ≈ $1.380–1.690</strong></li></ul><p class="hint" style="margin-top:8px">Preços da Uniqlo são aproximados. Tamanhos vieram dos links; confira na loja. Roupas abaixo de $110 por peça não pagam imposto em NY; perfumes pagam 8,875%.</p></section>`;}

const q=s=>encodeURIComponent(s);
const mapsUrl=a=>"https://www.google.com/maps/search/?api=1&query="+q(a);
function routeUrl(stops){const a=stops.filter(s=>!s[6]).map(s=>s[2]).filter(Boolean);if(a.length<2)return null;
  let u="https://www.google.com/maps/dir/?api=1&travelmode=transit&origin="+q(a[0])+"&destination="+q(a[a.length-1]);
  const mid=a.slice(1,-1).slice(0,8);if(mid.length)u+="&waypoints="+q(mid.join("|"));return u;}
let store={};try{store=JSON.parse(localStorage.getItem("nyc-done")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("nyc-done",JSON.stringify(store))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich=s=>esc(s).replace(/&lt;strong&gt;(.*?)&lt;\/strong&gt;/g,"<strong>$1</strong>");

const tabs=document.getElementById("tabs"),view=document.getElementById("view");
DAYS.forEach((d,i)=>{const b=document.createElement("button");b.role="tab";b.id="tab-"+d.k;
  b.innerHTML=`<span class="bullet" style="background:var(${d.c});${(d.check||d.shop)?"color:var(--band)":""}">${d.n}</span>${d.lbl}`;
  b.onclick=()=>show(i);tabs.appendChild(b);});

function moveHtml(m){if(!m)return"";const walk=/^A pé|^Mesmo/.test(m);const [mode,rest]=m.split(" · ");
  return `<div class="move ${walk?"walk":""}"><span aria-hidden="true">↓</span><b>${esc(mode)}</b>${rest?esc(rest):""}</div>`;}

function show(i){const d=DAYS[i];
  [...tabs.children].forEach((b,j)=>b.setAttribute("aria-selected",j===i));
  try{localStorage.setItem("nyc-tab",i)}catch(e){}
  let h=`<div class="dayhead"><span class="bullet" style="background:var(${d.c});${(d.check||d.shop)?"color:var(--bg)":""}">${d.n}</span><div><h2>${esc(d.title)}</h2><p>${esc(d.sub)}</p></div></div>`;
  if(d.shop){h+=renderShop();}
  else if(d.check){h+=`<section class="panel"><h3>Garantir antes da viagem</h3><ol class="line" style="--line:var(--rule)">`+
    TODO.map((t,j)=>{const id="todo-"+j,on=store[id];return `<li class="stop ${on?"done":""}"><button class="dot" data-id="${id}" aria-pressed="${!!on}" aria-label="Marcar ${esc(t)}"></button><div class="card"><p class="name" style="font-size:.92rem">${esc(t)}</p></div></li>`}).join("")+
    `</ol></section><section class="panel"><h3>Perfumes: onde testar</h3><ul><li>CDG Hinoki e Odeur 53: CDG Chelsea (sexta). 2ª chance: DSM (domingo)</li><li>Arquiste Sydney Rock Pool: C.O. Bigelow (sexta). 2ª chance: Stéle Williamsburg (domingo)</li><li>Opcional — Aesop Hwyl: Aesop Rockefeller Center (segunda) ou Aesop Williamsburg (domingo)</li><li>Opcional — Dries Van Noten Cannabis Patchouli: Bergdorf Goodman (segunda)</li></ul></section><section class="panel"><h3>Lembretes</h3><ul><li>Metrô: encoste sempre o mesmo cartão ou celular na catraca (OMNY). A semana sai por cerca de $35.</li><li>Domingo 01/11 acaba o horário de verão: o relógio volta 1 hora.</li><li>Clima: 8 a 15 °C com vento. Camadas e tênis confortável.</li></ul></section>`;}
  else{const r=routeUrl(d.stops);
    h+=`<div class="actions">${r?`<a class="btn primary" href="${r}" target="_blank" rel="noopener">Rota do dia no Maps</a>`:""}<div class="legend"><span><i class="sw"></i>principal</span><span><i class="sw o"></i>opcional</span></div></div>`;
    h+=`<ol class="line" style="--line:var(${d.c})">`+d.stops.map((s,j)=>{const id=d.k+"-"+j,on=store[id],opt=!!s[6];
      return `<li class="stop ${on?"done":""} ${opt?"opt":""}">${moveHtml(s[5])}<button class="dot" data-id="${id}" aria-pressed="${!!on}" aria-label="Marcar ${esc(s[1])} como feito"></button><div class="card"><div class="top"><span class="time">${esc(s[0])}</span><span style="display:flex;gap:6px">${opt?`<span class="tag opt">opcional</span>`:""}${s[4]?`<span class="tag">${esc(s[4])}</span>`:""}</span></div><p class="name">${esc(s[1])}</p>${s[3]?`<p class="note">${rich(s[3])}</p>`:""}${s[2]?`<a class="maps" href="${mapsUrl(s[2])}" target="_blank" rel="noopener">Maps</a>`:""}</div></li>`}).join("")+`</ol>`;
    h+=`<p class="hint">A rota do dia ignora as paradas opcionais e mostra até 10 por vez; use “Maps” em cada parada para o resto.</p>`;}
  view.innerHTML=h;
  view.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{const id=b.dataset.id;store[id]=!store[id];if(!store[id])delete store[id];save();
    b.setAttribute("aria-pressed",!!store[id]);b.closest(".stop").classList.toggle("done",!!store[id]);});
  document.getElementById("tab-"+d.k).scrollIntoView({inline:"center",block:"nearest"});
}
let start=0;const today=new Date(),dates=["2026-10-30","2026-10-31","2026-11-01","2026-11-02","2026-11-03","2026-11-04","2026-11-05"];
const iso=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
if(dates.includes(iso))start=dates.indexOf(iso);else{try{const t=+localStorage.getItem("nyc-tab");if(t>=0&&t<DAYS.length)start=t}catch(e){}}
show(start);
</script>


<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>

</body>
